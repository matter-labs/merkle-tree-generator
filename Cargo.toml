[package]
name = "merkle-tree-generator"
version = "0.1.0"
edition = "2024"
description = "Generates Merkle roots and proofs for OpenZeppelin MerkleProof-compatible claim trees"

[dependencies]
alloy-primitives = { version = "1", features = ["serde"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
csv = "1"
rs_merkle = { version = "1.5", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
